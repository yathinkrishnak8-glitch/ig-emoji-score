name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone and Map libxposed Submodule
        run: |
          echo "=== .gitmodules ===" && cat .gitmodules
          echo "=== settings.gradle.kts ===" && cat settings.gradle.kts
          
          SUB_URL=$(git config -f .gitmodules --get-regexp url | awk '{print $2}' | head -n 1)
          rm -rf libxposed-api libxposed-compat libxposed-tmp
          git clone --depth 1 "${SUB_URL:-https://github.com/libxposed/api.git}" libxposed-tmp
          
          # Populate libxposed-api with the full cloned repo
          cp -r libxposed-tmp libxposed-api
          
          # Also satisfy root-level libxposed-compat if settings.gradle.kts points there
          COMPAT_PATH=$(find libxposed-tmp -maxdepth 3 -name "build.gradle*" -path "*compat*" -exec dirname {} \; | head -n 1)
          if [ -n "$COMPAT_PATH" ]; then
            cp -r "$COMPAT_PATH" libxposed-compat
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IG-Emoji-Score-APK
          path: app/build/outputs/apk/debug/*.apk
