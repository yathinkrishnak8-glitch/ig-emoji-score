name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup libxposed-api cleanly
        run: |
          rm -rf libxposed libxposed-api libxposed-compat libxposed-src
          git clone --depth 1 https://github.com/libxposed/api.git libxposed-src
          
          # Find the real directories containing build.gradle(.kts) inside libxposed-src
          API_DIR=$(find libxposed-src -maxdepth 3 -name "build.gradle*" -path "*/api/*" -exec dirname {} \; | head -n 1)
          COMPAT_DIR=$(find libxposed-src -maxdepth 3 -name "build.gradle*" -path "*/compat/*" -exec dirname {} \; | head -n 1)
          
          echo "Found API_DIR=$API_DIR"
          echo "Found COMPAT_DIR=$COMPAT_DIR"
          
          cp -r "${API_DIR:-libxposed-src}" libxposed-api
          cp -r "${COMPAT_DIR:-libxposed-src}" libxposed-compat

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IG-Emoji-Score-APK
          path: app/build/outputs/apk/debug/*.apk
