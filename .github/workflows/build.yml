name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize libxposed projects
        run: |
          rm -rf libxposed libxposed-api libxposed-compat
          git clone --depth 1 https://github.com/libxposed/api.git libxposed-src
          ln -s libxposed-src libxposed-api
          ln -s libxposed-src/compat libxposed-compat
          ln -s libxposed-src libxposed

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IG-Emoji-Score-APK
          path: app/build/outputs/apk/debug/*.apk
